<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="800" height="510" rx="16" fill="#ffffff"/>
  <text x="60" y="38" font-size="20" font-weight="700" fill="#0f172a">Every BEC attack follows the same five steps</text>
  <text x="60" y="62" font-size="13" fill="#64748b">Step 4, the request, is the one moment the victim sees and decides on</text>

  <rect x="60" y="84" width="680" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="110" font-size="15" font-weight="700" fill="#0f172a">1. Research the target</text>
  <text x="80" y="131" font-size="13" fill="#475569">Learn who pays whom, how much and when: public websites, LinkedIn, or a hacked mailbox.</text>
  <line x1="400" y1="146" x2="400" y2="164" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="60" y="168" width="680" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="194" font-size="15" font-weight="700" fill="#0f172a">2. Get a trusted voice</text>
  <text x="80" y="215" font-size="13" fill="#475569">Register a lookalike domain, fake a display name, or hack a real mailbox.</text>
  <line x1="400" y1="230" x2="400" y2="248" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="60" y="252" width="680" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="278" font-size="15" font-weight="700" fill="#0f172a">3. Wait for the right moment</text>
  <text x="80" y="299" font-size="13" fill="#475569">Lurk until a real invoice, closing or payroll run is due; hide tracks with inbox rules.</text>
  <line x1="400" y1="314" x2="400" y2="332" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="60" y="336" width="680" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="362" font-size="15" font-weight="700" fill="#1e3a8a">4. Make the ask</text>
  <text x="80" y="383" font-size="13" fill="#1e3a8a">Our bank changed. Urgent wire, keep it confidential. Buy gift cards. Send the W-2s.</text>
  <rect x="580" y="350" width="146" height="28" rx="14" fill="#2563eb"/>
  <text x="653" y="369" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">BEC Guard checks here</text>
  <line x1="400" y1="398" x2="400" y2="416" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="60" y="420" width="680" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="446" font-size="15" font-weight="700" fill="#0f172a">5. Cash out fast</text>
  <text x="80" y="467" font-size="13" fill="#475569">Money lands in mule, crypto or prepaid accounts and is moved on within hours or days.</text>
</svg>
